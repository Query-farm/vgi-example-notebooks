[project]
name = "vgi-example-notebooks"
version = "0.3.31"
description = "Shared presentation and execution tools for Query.Farm VGI examples"
requires-python = ">=3.11"
dependencies = [
  "haybarn==2.0.0rc11", "jupysql==0.11.1", "matplotlib>=3.8,<3.12",
  "matplotlib-inline>=0.1.7,<0.3", "pandas>=2.2.3,<3", "seaborn==0.13.2",
  "ipython>=7.23.1,<10", "packaging>=20", "uv==0.13.8",
  "toml==0.10.2",
]

[project.optional-dependencies]
runner = ["nbclient==0.11.0", "nbformat==5.11.1", "ipykernel==7.4.0"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.17,<0.18"]

[project.scripts]
vgi-notebooks = "vgi_notebooks.execute:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vgi_notebooks"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
